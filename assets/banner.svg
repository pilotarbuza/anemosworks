<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="AnemosWorks">
  <defs>
    <!-- Dark Obsidian Canvas -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091215"/>
      <stop offset="60%" stop-color="#0E171B"/>
      <stop offset="100%" stop-color="#121F24"/>
    </linearGradient>

    <!-- Subtle Ambient Fill -->
    <radialGradient id="glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FC7C4" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#4FC7C4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Clean Rounded Card Canvas -->
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="19.5" fill="none" stroke="#24363C" stroke-width="1"/>

  <!-- ==================== LEFT: BRAND TYPOGRAPHY ==================== -->
  <g transform="translate(100, 140)">
    <!-- Main Title -->
    <text x="0" y="0" font-family="'Unbounded', 'Manrope', -apple-system, sans-serif" font-size="74" font-weight="700" letter-spacing="-2.5" fill="#F3EDE4">
      Anemos<tspan fill="#4FC7C4">Works</tspan>
    </text>

    <!-- Subtitle (Clean & Human) -->
    <text x="0" y="54" font-family="'Manrope', -apple-system, sans-serif" font-size="22" font-weight="400" fill="#97B0B4" letter-spacing="-0.3">
      AI-автоматизация для SOLIDWORKS и Autodesk Fusion
    </text>
  </g>

  <!-- ==================== RIGHT: PURE OFFICIAL ICON ==================== -->
  <!-- Authentic Anemos Chevron Mark (Scale 3.2x, perfectly centered) -->
  <g transform="translate(960, 85) scale(3.0)">
    <!-- Top Supersonic Chevron (Breeze Dark) -->
    <polygon points="32,2 54.5,45.5 32,35 9.5,45.5" fill="#4FC7C4"/>
    <!-- Bottom Wing Chevron (Warm White) -->
    <polygon points="6.77,50.77 2,60 32,46 62,60 57.23,50.77 32,39" fill="#F3EDE4"/>
    <!-- The Signature Garnet Square -->
    <rect x="58" y="58" width="6" height="6" fill="#FF6A4A"/>
  </g>
</svg>
