<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="AnemosWorks — AI automation for SOLIDWORKS and Autodesk Fusion">
  <defs>
    <!-- Brand Background (Anemos Ground & Surface) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1517"/>
      <stop offset="60%" stop-color="#101C21"/>
      <stop offset="100%" stop-color="#14232A"/>
    </linearGradient>

    <!-- Aerodynamic Breeze Flow Gradient -->
    <linearGradient id="breeze-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FC7C4"/>
      <stop offset="100%" stop-color="#BFE6E4"/>
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="ambient-breeze" cx="80%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#4FC7C4" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#4FC7C4" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#4FC7C4" stop-opacity="0"/>
    </radialGradient>

    <!-- Brand Dot Grid Pattern (from 04_Graphics) -->
    <pattern id="dot-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect x="12" y="12" width="2" height="2" fill="#24363C" opacity="0.6"/>
    </pattern>

    <!-- Precision Drop Shadow -->
    <filter id="mark-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4FC7C4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Card Canvas with Hairline Border -->
  <rect width="1280" height="380" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="20" fill="url(#ambient-breeze)"/>
  
  <!-- Right Side Dot Grid Mask -->
  <g opacity="0.5">
    <rect x="740" y="0" width="540" height="380" rx="20" fill="url(#dot-grid)"/>
  </g>

  <!-- Card Hairline Border -->
  <rect x="0.5" y="0.5" width="1279" height="379" rx="19.5" fill="none" stroke="#24363C" stroke-width="1"/>

  <!-- ==================== RIGHT: AERODYNAMIC CAD GEOMETRY ==================== -->
  <g transform="translate(860, 40)">
    <!-- Aerodynamic Streamlines (CFD flow contours) -->
    <g fill="none" stroke-linecap="round" opacity="0.4">
      <path d="M-80 90 C 40 40, 160 30, 340 70" stroke="#173A40" stroke-width="1.5" stroke-dasharray="4,6"/>
      <path d="M-100 150 C 30 110, 150 100, 360 140" stroke="#24363C" stroke-width="1.8"/>
      <path d="M-60 210 C 60 180, 170 185, 330 220" stroke="#4FC7C4" stroke-width="1" stroke-opacity="0.6"/>
      <path d="M-90 270 C 40 250, 150 260, 350 280" stroke="#173A40" stroke-width="1.2" stroke-dasharray="3,6"/>
    </g>

    <!-- CAD Coordinate Dimension Lines -->
    <g stroke="#24363C" stroke-width="1" opacity="0.6">
      <line x1="225" y1="20" x2="225" y2="280" stroke-dasharray="2,4"/>
      <line x1="60" y1="280" x2="330" y2="280"/>
      <circle cx="225" cy="20" r="3" fill="#4FC7C4"/>
      <circle cx="225" cy="280" r="3" fill="#4FC7C4"/>
    </g>

    <!-- Engineering Telemetry Label (Doto / JetBrains Mono) -->
    <g font-family="'JetBrains Mono', 'Doto', monospace" font-size="10.5" font-weight="600" fill="#97B0B4" opacity="0.6">
      <text x="235" y="45">CAD: SOLIDWORKS / FUSION</text>
      <text x="235" y="65">KERNEL: PARAMETRIC CSG</text>
      <text x="235" y="85">MACH: 0.85 · RE: 4.8×10⁶</text>
    </g>

    <!-- Big Official Anemos Supersonic Delta Mark (Scale 3.8x, centered at 140, 150) -->
    <g transform="translate(100, 30) scale(3.5)" filter="url(#mark-shadow)">
      <!-- Upper Delta Chevron -->
      <polygon points="32,2 54.5,45.5 32,35 9.5,45.5" fill="#4FC7C4"/>
      <!-- Lower Chevron -->
      <polygon points="6.77,50.77 2,60 32,46 62,60 57.23,50.77 32,39" fill="#F3EDE4" fill-opacity="0.95"/>
      <!-- The Official Garnet Square -->
      <rect x="58" y="58" width="6" height="6" fill="#FF6A4A"/>
    </g>
  </g>

  <!-- ==================== LEFT: TYPOGRAPHY & BRAND LOCKUP ==================== -->
  <g transform="translate(80, 80)">
    <!-- Top Kicker with Brand Garnet Square -->
    <g>
      <rect x="0" y="0" width="7" height="7" fill="#FF6A4A"/>
      <text x="18" y="7.5" fill="#4FC7C4" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" letter-spacing="3">AI FOR ENGINEERING CAD</text>
    </g>

    <!-- Main Title: AnemosWorks (Unbounded / Manrope) -->
    <g transform="translate(0, 78)">
      <text x="0" y="0" font-family="'Unbounded', 'Manrope', system-ui, sans-serif" font-size="68" font-weight="700" letter-spacing="-2.5" fill="#F3EDE4">
        Anemos<tspan fill="url(#breeze-grad)">Works</tspan>
      </text>
    </g>

    <!-- Subtitle (Manrope) -->
    <g transform="translate(0, 122)">
      <text x="0" y="0" font-family="'Manrope', system-ui, sans-serif" font-size="20.5" font-weight="400" fill="#97B0B4" letter-spacing="-0.3">
        AI-автоматизация для SOLIDWORKS и Autodesk Fusion
      </text>
    </g>

    <!-- Minimalist Pill (Surface + Breeze + Line) -->
    <g transform="translate(0, 162)">
      <rect width="380" height="38" rx="19" fill="#14232A" stroke="#24363C" stroke-width="1.2"/>
      <text x="22" y="24" fill="#4FC7C4" font-family="'Manrope', sans-serif" font-size="13.5" font-weight="600" letter-spacing="0.3">
        Параметрический CAD  /  Сборки  /  MCP Протокол
      </text>
    </g>

    <!-- Quiet Footer Line -->
    <g transform="translate(0, 230)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#536A72" letter-spacing="1">
        ANEMOS AIRCRAFT <tspan fill="#24363C">|</tspan> CORE v1.4.0 <tspan fill="#24363C">|</tspan> 140 CAD TOOLS
      </text>
    </g>
  </g>
</svg>
